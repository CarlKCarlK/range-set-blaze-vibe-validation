name = "range-set-blaze-vibe-validation"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["rangesetblaze"]
testDriver = "regression"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "RangeSetBlaze"

[[lean_lib]]
name = "regression"
roots = ["RangeSetBlaze.Regression"]

[[lean_exe]]
name = "rangesetblaze"
root = "Main"
